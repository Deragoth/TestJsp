name: Java JSP CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Configura JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build e Test con Maven
        run: mvn clean package

      - name: Login su Docker Hub
        uses: docker/login-action@v2
        with:
          username: \${{secrets.DOCKER_HUB_USERNAME}}
          password: \${{secrets.DOCKER_HUB_TOKEN}}

      - name: Costruisci e pubblica immagine Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: tuo-username-dockerhub/nome-app:latest

      - name: Deploy su Docker Desktop
        run: |
          docker pull tuo-username-dockerhub/nome-app:latest
          docker stop jsp-app || true
          docker rm jsp-app || true
          docker run -d -p 8080:8080 --name jsp-app tuo-username-dockerhub/nome-app:latest