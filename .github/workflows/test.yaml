  name: Java CI

  on: [push]

  jobs:
    build:
      # In GitHub Actions, questo utilizzerà ubuntu-latest
      # In act locale, specificherai l'immagine maven:3.8-openjdk-17
      runs-on: ubuntu-latest

      container:
        # Questa immagine Docker sarà usata per tutti gli step in questo job
        # Ha già JDK 17 e Maven preinstallati
        image: maven:3.8-openjdk-17
      
      steps:
        - uses: actions/checkout@v2

            # Lo step setup-java non è più necessario perché usiamo un'immagine con Java preinstallato
            # - name: Set up JDK 17
            #   uses: actions/setup-java@v2
            #   with:
            #     java-version: '17'
            #     distribution: 'adopt'

        - name: Build with Maven
          run: mvn -B package --file pom.xml

        - name: Test with Maven
          run: mvn -B test --file pom.xml
